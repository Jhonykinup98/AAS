services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: aas-backend
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Server=sqlserver;Database=AasDb;User Id=sa;Password=AasPass@123;TrustServerCertificate=True;
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: aas-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: aas-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=AasPass@123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "AasPass@123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlserver_data: